
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Allowance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>My Allowance Tracker</h1>
            <p>Manage your money, one peso at a time.</p>
        </header>

        <section class="dashboard">

            <div class="card balance">
                <h3>Remaining Balance</h3>
                <h2 id="balance">₱0.00</h2>
            </div>

            <div class="card income">
                <h3>Total Allowance</h3>
                <h2 id="income">₱0.00</h2>
            </div>

            <div class="card expense">
                <h3>Total Expenses</h3>
                <h2 id="expense">₱0.00</h2>
            </div>

        </section>

        <section class="form-section">
            
            <section class="budget-section">

                <h2>Monthly Budget</h2>

                <div class="budget-input">
             <input
                 type="number"
                 id="monthlyBudget"
                 placeholder="Enter monthly budget (₱)"
                 min="1"
                 step="0.01"
             >
                <button type="button" id="saveBudget">Set Budget</button>  
                </div>

                <div class="budget-details">
                 <p>Monthly Budget: <strong id="budgetAmount">₱0.00</strong></p>
                 <p>Spent This Month: <strong id="monthlySpent">₱0.00</strong></p>
                 <p>Budget Left: <strong id="budgetLeft">₱0.00</strong></p>
                </div>

                <div class="progress-container">
                <div id="budgetProgress"></div>
                </div>

                  <p id="budgetMessage"></p>

</section>

            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <label for="description">Description</label>
                <input
                    type="text"
                    id="description"
                    placeholder="e.g. Lunch, Transportation"
                    required
                >

                <label for="amount">Amount (₱)</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="type">Transaction Type</label>

                <select id="type">
                    <option value="income">Allowance</option>
                    <option value="expense">Expense</option>
                </select>
               
                <label for="category">Category</label>

                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Allowance">Allowance</option>
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="School Supplies">School Supplies</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Savings">Savings</option>
                    <option value="Others">Others</option>
                </select>

                <button type="submit">Add Transaction</button>

            </form>

        </section>

        <section class="history">

            <h2>Transaction History</h2>

            <div id="transactionList"></div>

        </section>

        <footer>
            <p>My Allowance Tracker | Student Project</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
